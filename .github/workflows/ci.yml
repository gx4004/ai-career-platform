name: CI

on:
  pull_request:
    branches: [main, chapter2]
  push:
    branches: [main, deploy]

permissions:
  contents: read

# Cancel any in-flight runs for the same ref so a fast follow-up push doesn't
# queue behind a now-stale older one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  containers:
    name: Container (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: frontend
            dockerfile: frontend/Dockerfile
            context: frontend
            runtime_user: node
          - name: backend
            dockerfile: backend/Dockerfile
            context: backend
            runtime_user: appuser
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build deployment image
        run: >-
          docker build
          --file "${{ matrix.dockerfile }}"
          --tag "career-workbench-${{ matrix.name }}:${{ github.sha }}"
          "${{ matrix.context }}"

      - name: Verify non-root runtime user
        env:
          IMAGE: career-workbench-${{ matrix.name }}:${{ github.sha }}
          EXPECTED_USER: ${{ matrix.runtime_user }}
        run: |
          test "$(docker image inspect --format '{{.Config.User}}' "$IMAGE")" = "$EXPECTED_USER"
          test "$(docker run --rm "$IMAGE" id -u)" != "0"

  frontend:
    name: Frontend (typecheck / test / build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.30.3

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Production dependency audit
        run: pnpm audit --prod --audit-level=high

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

  backend:
    name: Backend (ruff / pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cw
          POSTGRES_PASSWORD: cw
          POSTGRES_DB: cw_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cw"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install document render QA tools
        run: sudo apt-get update && sudo apt-get install --yes libreoffice-writer poppler-utils

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ruff check
        run: ruff check app

      - name: Populated packet-approval migration round trip
        env:
          DATABASE_URL: postgresql+psycopg2://cw:cw@localhost:5432/cw_ci
        run: python tests/migration_packet_approval_roundtrip.py

      - name: Populated submission migration round trip
        env:
          DATABASE_URL: postgresql+psycopg2://cw:cw@localhost:5432/cw_ci
        run: python tests/migration_submission_roundtrip.py

      - name: Alembic upgrade smoke
        env:
          DATABASE_URL: postgresql+psycopg2://cw:cw@localhost:5432/cw_ci
        run: alembic upgrade head

      - name: Concurrent submission retry proof
        env:
          DATABASE_URL: postgresql+psycopg2://cw:cw@localhost:5432/cw_ci
        run: python tests/postgres_submission_concurrency.py

      - name: Pytest
        run: pytest -q

  e2e:
    name: E2E (Playwright / PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cw
          POSTGRES_PASSWORD: cw
          POSTGRES_DB: cw_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cw -d cw_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.30.3

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install backend
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Install frontend
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium

      - name: Browser tracer journeys
        working-directory: frontend
        env:
          E2E_DATABASE_URL: postgresql+psycopg2://cw:cw@127.0.0.1:5432/cw_e2e
        run: pnpm test:e2e:ci

      - name: Upload Playwright failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-failure-evidence
          path: frontend/test-results
          if-no-files-found: ignore
          retention-days: 7
